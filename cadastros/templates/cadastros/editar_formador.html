{% extends "core/base.html" %}

{% block titulo %}Editar formador · FORMATECH{% endblock %}

{% block conteudo %}
<h1>Editar formador</h1>
{% if not formador.ativo %}
  <p>Este formador está inativo.</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Salvar</button>
  <a href="{% url 'cadastros:formadores' %}">Cancelar</a>
</form>
{% endblock %}
