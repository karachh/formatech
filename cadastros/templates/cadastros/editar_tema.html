{% extends "core/base.html" %}

{% block titulo %}Editar tema · FORMATECH{% endblock %}

{% block conteudo %}
<h1>Editar tema “{{ tema.nome }}”</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Salvar</button>
  <a href="{% url 'cadastros:temas' %}">Cancelar</a>
</form>
{% endblock %}
