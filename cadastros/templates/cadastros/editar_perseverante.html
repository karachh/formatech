{% extends "core/base.html" %}

{% block titulo %}Editar perseverante · FORMATECH{% endblock %}

{% block conteudo %}
<h1>Editar perseverante</h1>
{% if not participante.ativo %}
  <p>Este perseverante está inativo.</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Salvar</button>
  <a href="{% url 'cadastros:perseverantes' %}?ciclo={{ participante.ciclo_id }}">Cancelar</a>
</form>
{% endblock %}
